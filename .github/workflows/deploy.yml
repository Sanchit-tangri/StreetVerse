name: Deploy StreetVerse to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to Laptop Server
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Diagnostic Environment Check
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "   Node version: $(node -v 2>$null)"
          Write-Host "   NPM version:  $(npm -v 2>$null)"
          Write-Host "   Git version:  $(git --version 2>$null)"
          Write-Host "   Python:       $(python --version 2>$null)"
          Write-Host "==========================================" -ForegroundColor Cyan

      - name: Install Dependencies & Build API Gateway
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Installing root dependencies..."
          npm install --no-audit --no-fund
          
          Write-Host "Installing API Gateway dependencies..."
          npm --prefix services/api-gateway install --no-audit --no-fund
          
          Write-Host "Building API Gateway..."
          npm --prefix services/api-gateway run build
          
          Write-Host "Installing Python AI Engine dependencies..."
          python -m pip install --upgrade pip
          python -m pip install -r services/ai-agent-engine/requirements.txt

      - name: Ensure Database Containers & Run Seed Migrations
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $docker = Get-Command docker -ErrorAction SilentlyContinue
            if ($docker) {
              Write-Host "Attempting to start Docker containers..."
              docker compose up -d
              
              Write-Host "Syncing database schemas and seeding new merchants/items..."
              node packages/database-schemas/seed.js
            } else {
              Write-Host "Docker not in PATH. Resilient database pool active."
            }
          } catch {
            Write-Host "Docker not running. Resilient pool will handle storage."
          }

      - name: Launch or Reload Backend with PM2
        run: |
          $ErrorActionPreference = 'Continue'
          $npmPath = Join-Path $env:APPDATA "npm"
          if ($env:Path -notlike "*$npmPath*") {
            $env:Path = "$npmPath;$env:Path"
          }

          Write-Host "Updating PM2 services with latest deployment build..."
          npx --yes pm2 delete streetverse-gateway 2>$null
          npx --yes pm2 delete streetverse-ai-engine 2>$null
          npx --yes pm2 start ecosystem.config.js
          npx --yes pm2 save
          Write-Host "StreetVerse Home Server successfully deployed and active!" -ForegroundColor Green
