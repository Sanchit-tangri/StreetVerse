name: Deploy StreetVerse to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to Laptop Server
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Install Monorepo & Gateway Dependencies
        run: |
          Write-Host "Installing dependencies..."
          npm install --no-audit
          npm --prefix services/api-gateway install --no-audit
          npm --prefix services/api-gateway run build

      - name: Ensure Docker Databases are Running
        run: |
          $docker = Get-Command docker -ErrorAction SilentlyContinue
          if ($docker) {
            Write-Host "Starting Docker containers..."
            docker compose up -d
          } else {
            Write-Host "Docker not in PATH. Resilient database pool is active."
          }

      - name: Deploy & Reload Backend Services with PM2
        run: |
          Write-Host "Reloading PM2 processes..."
          # Refresh Path in runner session so globally installed npm tools are visible
          $npmPath = Join-Path $env:APPDATA "npm"
          if ($env:Path -notlike "*$npmPath*") {
            $env:Path = "$npmPath;$env:Path"
          }

          # Check if pm2 is already running the apps
          npx pm2 describe streetverse-gateway 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Reloading existing PM2 processes..."
            npx pm2 reload ecosystem.config.js --update-env
          } else {
            Write-Host "Starting fresh PM2 processes..."
            npx pm2 start ecosystem.config.js
          }
          npx pm2 save
          Write-Host "StreetVerse Home Server successfully deployed and running!"
