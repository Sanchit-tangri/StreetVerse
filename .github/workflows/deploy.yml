name: Deploy StreetVerse to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Auto Deploy to Laptop Server
    runs-on: self-hosted
    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      - name: Install Monorepo & Gateway Dependencies
        run: |
          npm install
          npm --prefix services/api-gateway install
          npm --prefix services/api-gateway run build

      - name: Ensure Docker Databases are Running
        shell: powershell
        run: |
          $docker = Get-Command docker -ErrorAction SilentlyContinue
          if ($docker) {
            docker compose up -d
          } else {
            Write-Host "Docker not detected in PATH. Resilient in-memory database will maintain zero downtime."
          }

      - name: Reload Backend Services with PM2
        shell: powershell
        run: |
          $pm2 = Get-Command pm2 -ErrorAction SilentlyContinue
          if (-not $pm2) {
            Write-Host "Installing PM2 globally..."
            npm install -g pm2
          }
          pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
          pm2 save
          Write-Host "StreetVerse Home Server successfully updated and running!"
